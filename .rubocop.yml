inherit_gem:
  fablicop:
    - 'config/.base_rubocop.yml'

AllCops:
  # fablicop 1.10.3 (rubocop ~> 1.48) cannot detect Ruby 4.0 from .ruby-version.
  # Pin to the highest version it supports; the code itself uses no newer syntax.
  TargetRubyVersion: 3.3
  Exclude:
    - 'bin/*'
    - 'vendor/**/*'
    - 'db/schema.rb'

RSpec/InstanceVariable:
  Enabled: false

Rails/Output:
  AutoCorrect: false

Metrics/AbcSize:
  Max: 24

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/ImplicitSubject:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false
